apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-md-docs
  namespace: docs
  labels:
    app: local-md-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: local-md-docs
  template:
    metadata:
      labels:
        app: local-md-docs
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - oci-arm-3
                    - oci-arm-4
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - local-md-docs
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web
        image: localhost:32500/local-md-docs:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: ROOT_DIR
          value: "/docs"
        - name: PINNED_ROOTS
          value: "/docs"
        - name: LOCK_ROOT
          value: "false"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
