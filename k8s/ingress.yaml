apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-md-docs-ingress
  namespace: docs
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: docs-tailscale-ip-only@kubernetescrd,docs-local-docs-redirect@kubernetescrd,docs-local-docs-strip@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: oci-arm-4.gannet-justitia.ts.net
    http:
      paths:
      - path: /local-docs
        pathType: Prefix
        backend:
          service:
            name: local-md-docs
            port:
              number: 80
  - host: "100.115.101.108"
    http:
      paths:
      - path: /local-docs
        pathType: Prefix
        backend:
          service:
            name: local-md-docs
            port:
              number: 80
  tls:
  - hosts:
    - oci-arm-4.gannet-justitia.ts.net
    - "100.115.101.108"
    secretName: tailscale-tls-oci-arm-4
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-md-docs-root-redirect
  namespace: docs
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: docs-tailscale-ip-only@kubernetescrd,docs-root-to-localdocs@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
  - host: oci-arm-4.gannet-justitia.ts.net
    http:
      paths:
      - path: /
        pathType: Exact
        backend:
          service:
            name: local-md-docs
            port:
              number: 80
  - host: "100.115.101.108"
    http:
      paths:
      - path: /
        pathType: Exact
        backend:
          service:
            name: local-md-docs
            port:
              number: 80
  tls:
  - hosts:
    - oci-arm-4.gannet-justitia.ts.net
    - "100.115.101.108"
    secretName: tailscale-tls-oci-arm-4
